# Поиск луж для чистобота: без требования прямой видимости (бот проезжает под дверьми,
# путь всё равно проверяет pathfinding), пропускает недоступные лужи и лужи, к которым
# уже едет другой бот, находящийся ближе.
- type: utilityQuery
  id: CleanbotPuddles
  query:
    - !type:ComponentQuery
      components:
        - type: Puddle
    - !type:PuddleFilter
  considerations:
    - !type:TargetDistanceCon
      curve: !type:PresetCurve
        preset: TargetDistance
    - !type:TargetAccessibleCon
      curve: !type:BoolCurve
    - !type:TargetNotUnreachableCon
      curve: !type:BoolCurve
    - !type:TargetNotClaimedCon
      curve: !type:BoolCurve

- type: htnCompound
  id: CleanbotBufferPuddlesCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: CleanbotPuddles

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: MeleeRange
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:TargetInRangePrecondition
              targetKey: Target
              rangeKey: InteractRange
          operator: !type:InteractWithOperator
            targetKey: Target
          services:
            - !type:UtilityService
              id: PuddleService
              proto: CleanbotPuddles
              key: Target

# Сюда попадаем, только если лужа нашлась, но до неё не удалось проложить путь.
# Запоминаем её как недоступную (на 30 секунд), чтобы на следующем планировании выбрать другую.
- type: htnCompound
  id: CleanbotForgetUnreachablePuddleCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: CleanbotPuddles
        - !type:HTNPrimitiveTask
          operator: !type:MarkTargetUnreachableOperator
            targetKey: Target
